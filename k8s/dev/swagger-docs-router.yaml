apiVersion: v1
kind: ConfigMap
metadata:
  name: swagger-docs-router
  namespace: dev
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location = /healthz { return 200 "ok\n"; }
        location = /docs {
            proxy_pass http://swagger-ui.dev.svc.cluster.local:8080;
        }
        location /docs/ {
            proxy_pass http://swagger-ui.dev.svc.cluster.local:8080;
        }
        location = /api/v1/auth/v3/api-docs {
            proxy_pass http://auth-service.dev.svc.cluster.local:8080/v3/api-docs;
        }
        location /api/v1/auth/v3/api-docs/ {
            proxy_pass http://auth-service.dev.svc.cluster.local:8080/v3/api-docs/;
        }
        location = /api/v1/users/v3/api-docs {
            proxy_pass http://user-service.dev.svc.cluster.local:8080/v3/api-docs;
        }
        location /api/v1/users/v3/api-docs/ {
            proxy_pass http://user-service.dev.svc.cluster.local:8080/v3/api-docs/;
        }
        location = /api/v1/orders/v3/api-docs {
            proxy_pass http://order-service.dev.svc.cluster.local:8080/v3/api-docs;
        }
        location /api/v1/orders/v3/api-docs/ {
            proxy_pass http://order-service.dev.svc.cluster.local:8080/v3/api-docs/;
        }
        location = /api/v1/payments/v3/api-docs {
            proxy_pass http://payment-service.dev.svc.cluster.local:8080/v3/api-docs;
        }
        location /api/v1/payments/v3/api-docs/ {
            proxy_pass http://payment-service.dev.svc.cluster.local:8080/v3/api-docs/;
        }
        location = /api/v1/products/v3/api-docs {
            proxy_pass http://product-service.dev.svc.cluster.local:8080/v3/api-docs;
        }
        location /api/v1/products/v3/api-docs/ {
            proxy_pass http://product-service.dev.svc.cluster.local:8080/v3/api-docs/;
        }
        location = /api/v1/admin/oms/v3/api-docs {
            proxy_pass http://oms-service.dev.svc.cluster.local:8080/v3/api-docs;
        }
        location /api/v1/admin/oms/v3/api-docs/ {
            proxy_pass http://oms-service.dev.svc.cluster.local:8080/v3/api-docs/;
        }
        location = /api/v1/admin/wms/v3/api-docs {
            proxy_pass http://wms-service.dev.svc.cluster.local:8080/v3/api-docs;
        }
        location /api/v1/admin/wms/v3/api-docs/ {
            proxy_pass http://wms-service.dev.svc.cluster.local:8080/v3/api-docs/;
        }
        location = /api/v1/admin/scm/v3/api-docs {
            proxy_pass http://scm-service.dev.svc.cluster.local:8080/v3/api-docs;
        }
        location /api/v1/admin/scm/v3/api-docs/ {
            proxy_pass http://scm-service.dev.svc.cluster.local:8080/v3/api-docs/;
        }
        location = /api/v1/ai/v3/api-docs {
            proxy_pass http://kurly-ai-serving.dev.svc.cluster.local:8000/openapi.json;
        }
        location = /api/v1/ai/v3/api-docs/ {
            proxy_pass http://kurly-ai-serving.dev.svc.cluster.local:8000/openapi.json;
        }
        location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-docs-router
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swagger-docs-router
  template:
    metadata:
      labels:
        app: swagger-docs-router
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: swagger-docs-router
---
apiVersion: v1
kind: Service
metadata:
  name: swagger-docs-router
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: swagger-docs-router
  ports:
    - name: http
      port: 8080
      targetPort: http

