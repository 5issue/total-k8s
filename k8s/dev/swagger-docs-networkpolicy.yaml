apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: swagger-ui-allow-docs-router
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: swagger-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: swagger-docs-router
      ports:
        - protocol: TCP
          port: 8080