# 자리표시(placeholder). 실제 배포 시 값/네임스페이스를 채워 사용한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: total-client-config
  namespace: frontend
  labels:
    app: total-client
data:
  # ⚠️ NEXT_PUBLIC_* 는 빌드 타임에 번들로 인라인된다.
  #    여기 값을 바꿔도 브라우저 번들에는 반영되지 않는다 (빌드 시 build-arg 로 주입).
  #    이 ConfigMap 은 "서버 런타임에서만 읽는" 값에 사용한다.
  API_INTERNAL_URL: "http://api-internal.default.svc.cluster.local"

  # 참고용(서버 로깅/분기용). 브라우저 인라인 값은 빌드 타임 것이 최종.
  NEXT_PUBLIC_APP_ENV: "production"
