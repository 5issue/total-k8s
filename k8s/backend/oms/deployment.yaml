apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-service
  namespace: backend
  labels:
    app: oms-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oms-service
  template:
    metadata:
      labels:
        app: oms-service
    spec:
      nodeSelector:
        karpenter.sh/capacity-type: spot
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: oms-service
      serviceAccountName: backend-common-sa
      containers:
        - name: oms-service
          image: 596601390909.dkr.ecr.ap-northeast-2.amazonaws.com/kurly-oms:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_JWKS_URI
              value: "http://auth-service.backend.svc.cluster.local:8080/.well-known/jwks.json"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq.messaging.svc.cluster.local"
            - name: SPRING_RABBITMQ_PORT
              value: "5671"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: oms-service
  namespace: backend
  labels:
    app: oms-service
spec:
  type: ClusterIP
  selector:
    app: oms-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080