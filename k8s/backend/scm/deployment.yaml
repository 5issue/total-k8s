apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-service
  namespace: backend
  labels:
    app: scm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scm-service
  template:
    metadata:
      labels:
        app: scm-service
    spec:
      nodeSelector:
        karpenter.sh/capacity-type: spot
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: scm-service
      serviceAccountName: backend-common-sa
      containers:
        - name: scm-service
          image: 596601390909.dkr.ecr.ap-northeast-2.amazonaws.com/kurly-scm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_JWKS_URI
              value: "http://auth-service.backend.svc.cluster.local:8080/.well-known/jwks.json"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq.messaging.svc.cluster.local"
            - name: SPRING_RABBITMQ_PORT
              value: "5671"
            - name: SPRING_RABBITMQ_SSL_ENABLED
              value: "true"
            - name: RABBITMQ_SSL_CERT_PATH
              value: "/etc/ssl/certs/rabbitmq/ca.crt"
            - name: DB_HOST
              value: "shared-pg-rw.backend.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "scm_db"
            - name: DB_USERNAME
              value: "scm_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-pg-scm-service-credentials
                  key: password
          volumeMounts:
            - name: rabbitmq-ca
              mountPath: /etc/ssl/certs/rabbitmq
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: rabbitmq-ca
          secret:
            secretName: rabbitmq-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: scm-service
  namespace: backend
  labels:
    app: scm-service
spec:
  type: ClusterIP
  selector:
    app: scm-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080