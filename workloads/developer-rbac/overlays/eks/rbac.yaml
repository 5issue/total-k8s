apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer-pod-access-role
rules:
  # Pod 목록 조회, 상태 확인, 실시간 로그 조회
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  # Pod 내부 Shell 직접 접속 (kubectl exec)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # 배포 상태 점검을 위한 워크로드 조회
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
# Dev 네임스페이스 바인딩
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-pod-access-binding
  namespace: dev
subjects:
  - kind: Group
    name: backend-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: developer-pod-access-role
  apiGroup: rbac.authorization.k8s.io
---
# Prod 환경 (백엔드 서비스 네임스페이스) 바인딩
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-pod-access-binding
  namespace: frontend
subjects:
  - kind: Group
    name: backend-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: developer-pod-access-role
  apiGroup: rbac.authorization.k8s.io
---
# Prod 환경 (백엔드 서비스 네임스페이스) 바인딩
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-pod-access-binding
  namespace: backend
subjects:
  - kind: Group
    name: backend-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: developer-pod-access-role
  apiGroup: rbac.authorization.k8s.io