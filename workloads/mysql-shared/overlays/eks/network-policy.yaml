apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-mysql-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: shared-mysql
  policyTypes:
    - Ingress
  ingress:
    # backend 및 dev 네임스페이스의 백엔드 서비스들 허용
    - from:
        # dev 네임스페이스의 앱들
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["auth-service", "order-service", "payment-service", "user-service"]
        # backend 네임스페이스 내부 앱들
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: order-service
        - podSelector:
            matchLabels:
              app: payment-service
        - podSelector:
            matchLabels:
              app: user-service
      ports:
        - protocol: TCP
          port: 3306
    # 백업 파드 허용 (기존 유지)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mysql-backup
              app.kubernetes.io/created-by: moco
      ports:
        - protocol: TCP
          port: 3306
    # 계정 프로비저너 허용 (기존 유지)
    - from:
        - podSelector:
            matchLabels:
              app: mysql-account-provisioner
      ports:
        - protocol: TCP
          port: 3306