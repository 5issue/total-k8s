apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-mysql-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shared-mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: order-service
        - podSelector:
            matchLabels:
              app: payment-service
        - podSelector:
            matchLabels:
              app: member-service
      ports:
        - protocol: TCP
          port: 3306
