apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-mysql-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: shared-mysql
  policyTypes:
    - Ingress
  ingress:
    # backend 및 dev 네임스페이스의 백엔드 서비스들 허용
    - from:
        # dev 네임스페이스의 앱들
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["auth-service", "order-service", "payment-service", "user-service"]
        # backend 네임스페이스 내부 앱들
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: order-service
        - podSelector:
            matchLabels:
              app: payment-service
        - podSelector:
            matchLabels:
              app: user-service
      ports:
        - protocol: TCP
          port: 3306
    # 백업 파드 허용 
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mysql-backup
              app.kubernetes.io/created-by: moco
      ports:
        - protocol: TCP
          port: 3306
    # 계정 프로비저너 허용 
    - from:
        - podSelector:
            matchLabels:
              app: mysql-account-provisioner
      ports:
        - protocol: TCP
          port: 3306
    # MOCO Controller Manager 통신 허용 (33062 관리 포트, 9080/8080 gRPC)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: moco-system
      ports:
        - protocol: TCP
          port: 33062
        - protocol: TCP
          port: 9080
        - protocol: TCP
          port: 8080
    # MySQL 파드 상호 간 복제 동기화 및 Kubelet Readiness/Liveness 프로브(9081) 통신 허용
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: shared-mysql
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 33060
        - protocol: TCP
          port: 33062
        - protocol: TCP
          port: 9081
    - ports:
        - protocol: TCP
          port: 9081  # Kubelet(노드 호스트)의 HTTP 헬스체크(/healthz, /readyz) 허용