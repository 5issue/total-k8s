apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backend

resources:
  - ../../base
  - network-policy.yaml
  - pdb.yaml
  - password-policy-configmap.yaml
  - rbac-secret-access.yaml
  - serviceAccount.yaml
  - scheduled-backup.yaml

patches:
  - path: mysqlcluster-patch.yaml
    target:
      group: moco.cybozu.com
      version: v1beta2
      kind: MySQLCluster
      name: shared-mysql