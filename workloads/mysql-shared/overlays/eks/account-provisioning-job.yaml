apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-create-app-accounts
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: mysql-account-provisioner
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-accounts
          image: ghcr.io/cybozu-go/moco/mysql:8.0.41
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              cat > /tmp/create-accounts.sql <<SQL
              CREATE USER IF NOT EXISTS 'auth_user'@'%' IDENTIFIED BY '${AUTH_PASSWORD}';
              CREATE DATABASE IF NOT EXISTS auth_db;
              GRANT ALL PRIVILEGES ON auth_db.* TO 'auth_user'@'%';

              CREATE USER IF NOT EXISTS 'order_user'@'%' IDENTIFIED BY '${ORDER_PASSWORD}';
              CREATE DATABASE IF NOT EXISTS order_db;
              GRANT ALL PRIVILEGES ON order_db.* TO 'order_user'@'%';

              CREATE USER IF NOT EXISTS 'payment_user'@'%' IDENTIFIED BY '${PAYMENT_PASSWORD}';
              CREATE DATABASE IF NOT EXISTS payment_db;
              GRANT ALL PRIVILEGES ON payment_db.* TO 'payment_user'@'%';

              CREATE USER IF NOT EXISTS 'user_user'@'%' IDENTIFIED BY '${USER_PASSWORD}';
              CREATE DATABASE IF NOT EXISTS user_db;
              GRANT ALL PRIVILEGES ON user_db.* TO 'user_user'@'%';

              FLUSH PRIVILEGES;
              SQL

              mysql -h moco-shared-mysql-primary.backend.svc.cluster.local -P 3306 \
                -u moco-admin -p"${MOCO_ADMIN_PASSWORD}" < /tmp/create-accounts.sql
          env:
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-mysql-accounts
                  key: auth_service_password
            - name: ORDER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-mysql-accounts
                  key: order_service_password
            - name: PAYMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-mysql-accounts
                  key: payment_service_password
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-mysql-accounts
                  key: member_service_password
            - name: MOCO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moco-shared-mysql
                  key: ADMIN_PASSWORD
