- op: add
  path: /spec/mysqlConfigMapName
  value: shared-mysql-password-policy
- op: add
  path: /spec/podTemplate/spec/topologySpreadConstraints
  value:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: shared-mysql
- op: add
  path: /spec/podTemplate/spec/affinity
  value:
    nodeAffinity:                        # 상태 저장 워크로드: On-Demand 필수 (Redis·RabbitMQ와 동일)
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/capacityType
                operator: In
                values: ["ON_DEMAND"]
          - matchExpressions:
              - key: karpenter.sh/capacity-type
                operator: In
                values: ["on-demand"]
- op: add
  path: /spec/podTemplate/spec/containers/0/resources
  value:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1.5Gi
- op: add
  path: /spec/volumeClaimTemplates
  value:
    - metadata:
        name: mysql-data
        labels:
          app.kubernetes.io/name: shared-mysql
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
- op: add
  path: /spec/podTemplate/spec/securityContext
  value:
    runAsNonRoot: true
    fsGroup: 10000
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault
- op: add
  path: /spec/podTemplate/spec/containers/0/securityContext
  value:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false
    runAsNonRoot: true
- op: add
  path: /spec/backupPolicyName
  value: shared-mysql-daily