apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-mysql-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - shared-mysql-controller   #배포 후 실제 이름 확인 필요
      - shared-mysql-accounts     
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-mysql-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-mysql-secret-reader
subjects: [] # 임시 공백