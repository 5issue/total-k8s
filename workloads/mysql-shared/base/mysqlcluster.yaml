apiVersion: moco.cybozu.com/v1beta2
kind: MySQLCluster
metadata:
  name: shared-mysql
  labels:
    app.kubernetes.io/name: shared-mysql
    app.kubernetes.io/component: database
spec:
  # MOCO 제약: replicas는 1, 3, 5(양의 홀수)만 허용 - quorum 기반 복제 특성상 2 불가
  replicas: 3
  podTemplate:
    spec:
      containers:
        - name: mysqld
          image: ghcr.io/cybozu-go/moco/mysql:8.0.41  # TODO: 팀 표준 버전 재확인
