- op: add
  path: /spec/postgresql
  value:
    shared_preload_libraries:
      - pgaudit
      - passwordcheck
      - credcheck
    parameters:
      pgaudit.log: "all, -misc"
      pgaudit.log_catalog: "off"
      pgaudit.log_parameter: "on"
      pgaudit.log_relation: "on"
      credcheck.password_min_length: "12"
      credcheck.password_reuse_history: "3"
      credcheck.password_valid_max: "90"
- op: add
  path: /spec/affinity
  value:
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: karpenter.sh/capacity-type
                operator: In
                values: ["on-demand"]
        - weight: 100
          preference:
            matchExpressions:
              - key: eks.amazonaws.com/capacityType
                operator: In
                values: ["ON_DEMAND"]
- op: add
  path: /spec/resources
  value:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1.5Gi
- op: add
  path: /spec/storage
  value:
    storageClass: gp3
    size: 10Gi
- op: add
  path: /spec/monitoring
  value:
    enablePodMonitor: true
- op: add
  path: /spec/backup
  value:
    target: prefer-standby
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://kurly-db-backup/shared-pg"
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
        immediateCheckpoint: false
- op: add
  path: /spec/serviceAccountTemplate
  value:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::596601390909:role/cnpg-s3-backup-role"
- op: add
  path: /spec/managed
  value:
    roles:
      - name: product_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-product-service-credentials
      - name: wms_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-wms-service-credentials
      - name: scm_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-scm-service-credentials
      - name: oms_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-oms-service-credentials