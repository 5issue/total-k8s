- op: add
  path: /spec/enableSuperuserAccess
  value: false
- op: add
  path: /spec/postgresql
  value:
    shared_preload_libraries:
      - pgaudit
      - passwordcheck
    parameters:
      max_connections: "300"
      pgaudit.log: "all, -misc"
      pgaudit.log_catalog: "off"
      pgaudit.log_parameter: "on"
      pgaudit.log_relation: "on"
      pgaudit.log_level: "log"
- op: add
  path: /spec/affinity
  value:
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeAffinity:                        # 상태 저장 워크로드: On-Demand 필수 (Redis·RabbitMQ와 동일)
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/capacityType
                operator: In
                values: ["ON_DEMAND"]
          - matchExpressions:
              - key: karpenter.sh/capacity-type
                operator: In
                values: ["on-demand"]
- op: add
  path: /spec/resources
  value:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1.5Gi
- op: add
  path: /spec/storage
  value:
    storageClass: gp3
    size: 10Gi
- op: add
  path: /spec/monitoring
  value:
    enablePodMonitor: true
- op: add
  path: /spec/backup
  value:
    target: prefer-standby
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://kurly-db-backup/shared-pg"
      # 클러스터 재생성 시 이전 세대 WAL과 충돌(Expected empty archive)하므로 세대별로 경로 분리
      serverName: shared-pg-v2
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
        immediateCheckpoint: false
- op: add
  path: /spec/serviceAccountTemplate
  value:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::596601390909:role/cnpg-s3-backup-role"
- op: add
  path: /spec/managed
  value:
    roles:
      - name: product_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-product-service-credentials
      - name: wms_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-wms-service-credentials
      - name: scm_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-scm-service-credentials
      - name: oms_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-oms-service-credentials
      - name: ai_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-ai-service-credentials
      - name: dba_admin
        ensure: present
        login: true
        createdb: true
        createrole: true
        inRoles:
          - pg_read_all_data
          - pg_write_all_data
        passwordSecret:
          name: shared-pg-dba-admin-credentials
      # CNPG initdb가 기본 생성하는 app 계정(app DB owner). 사용처가 없어 로그인만 차단(D-02)
      - name: app
        ensure: present
        login: false