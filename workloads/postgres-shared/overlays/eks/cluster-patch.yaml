- op: add
  path: /spec/enableSuperuserAccess
  value: false
- op: add
  path: /spec/postgresql
  value:
    shared_preload_libraries:
      - pgaudit
      - passwordcheck
    parameters:
      pgaudit.log: "all, -misc"
      pgaudit.log_catalog: "off"
      pgaudit.log_parameter: "on"
      pgaudit.log_relation: "on"
- op: add
  path: /spec/affinity
  value:
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: karpenter.sh/capacity-type
                operator: In
                values: ["on-demand"]
        - weight: 100
          preference:
            matchExpressions:
              - key: eks.amazonaws.com/capacityType
                operator: In
                values: ["ON_DEMAND"]
- op: add
  path: /spec/resources
  value:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1.5Gi
- op: add
  path: /spec/storage
  value:
    storageClass: gp3
    size: 10Gi
- op: add
  path: /spec/monitoring
  value:
    enablePodMonitor: true
- op: add
  path: /spec/backup
  value:
    target: prefer-standby
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://kurly-db-backup/shared-pg"
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
        immediateCheckpoint: false
- op: add
  path: /spec/serviceAccountTemplate
  value:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::596601390909:role/cnpg-s3-backup-role"
- op: add
  path: /spec/managed
  value:
    roles:
      - name: product_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-product-service-credentials
      - name: wms_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-wms-service-credentials
      - name: scm_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-scm-service-credentials
      - name: oms_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-oms-service-credentials
      - name: ai_user
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-ai-service-credentials
      # DBA 관리자 계정 (jaehyeok, jongwon 전용, RBAC: db-admin-readers 그룹만 secret 조회 가능)
      # superuser는 아니며(enableSuperuserAccess: false), createdb/createrole + 전체 데이터
      # 읽기/쓰기(pg_read_all_data, pg_write_all_data)를 가진 DDL 포함 관리자 계정.
      # 주의: product_user 등이 소유한 기존 테이블의 ALTER/DROP은 소유권 기반이라
      # 필요 시 `SET ROLE product_user;` 후 작업해야 함 (superuser가 아니므로).
      - name: dba_admin
        ensure: present
        login: true
        createdb: true
        createrole: true
        inRoles:
          - pg_read_all_data
          - pg_write_all_data
        passwordSecret:
          name: shared-pg-dba-admin-credentials