apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backend

resources:
  - ../../base
  - network-policy.yaml
  - pdb.yaml
  - rbac-secret-access.yaml
  - service-databases.yaml
  - scheduled-backup.yaml

patches:
  - path: cluster-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: shared-pg