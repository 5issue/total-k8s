apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-redis-secret-reader
  namespace: backend
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - rabbitmq-ca
      - redis-credentials
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-redis-secret-reader
  namespace: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-redis-secret-reader
subjects:
  - kind: Group
    name: rabbitmq-redis-readers
    apiGroup: rbac.authorization.k8s.io
