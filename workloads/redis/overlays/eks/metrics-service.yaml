apiVersion: v1
kind: Service
metadata:
  name: redis-metrics
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
      protocol: TCP
      