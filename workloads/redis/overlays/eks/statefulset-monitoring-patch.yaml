- op: add
  path: /spec/template/spec/containers/-
  value:
    name: redis-exporter
    image: ghcr.io/oliver006/redis_exporter:v1.89.0
    imagePullPolicy: IfNotPresent
    env:
      - name: REDIS_ADDR
        value: redis://127.0.0.1:6379
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: redis-credentials
            key: password
      - name: REDIS_EXPORTER_DISABLE_SCRAPE_ENDPOINT
        value: "true"
    ports:
      - name: metrics
        containerPort: 9121
        protocol: TCP
    readinessProbe:
      httpGet:
        path: /health
        port: metrics
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /health
        port: metrics
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 59000
      runAsGroup: 59000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL