apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-provisioning-script
  labels:
    app.kubernetes.io/name: rabbitmq-provisioner
    app.kubernetes.io/component: credential-provisioning
data:
  provision.py: |
    import base64
    import json
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request


    MANAGEMENT_URL = "https://rabbitmq.messaging.svc.cluster.local:15671"
    APPLICATION_VHOST = "total-prod"
    READINESS_TIMEOUT_SECONDS = 600
    RETRY_SECONDS = 5
    IDENTITY_CONTRACTS = (
        {
            "name": "backend",
            "username": "total-backend",
            "secret_path": "/var/run/rabbitmq-secrets/application",
            "permissions": {"configure": ".*", "write": ".*", "read": ".*"},
        },
        {
            "name": "wms",
            "username": "total-wms",
            "secret_path": "/var/run/rabbitmq-secrets/wms",
            "permissions": {
                "configure": r"^wms\.topic\.exchange$",
                "write": r"^wms\.topic\.exchange$",
                "read": r"^$",
            },
            "topic_permission": {
                "exchange": "wms.topic.exchange",
                "configure": r"^$",
                "write": r"^wms\.return\.inspected$",
                "read": r"^$",
            },
        },
        {
            "name": "oms",
            "username": "total-oms",
            "secret_path": "/var/run/rabbitmq-secrets/oms",
            "permissions": {
                "configure": (
                    r"^(oms\.topic\.exchange|oms\."
                    r"(order-payment-completed|return-requested|wms-inspected|payment-refunded)"
                    r"\.(queue|dlq))$"
                ),
                "write": (
                    r"^(amq\.default|oms\.topic\.exchange|oms\."
                    r"(order-payment-completed|return-requested|wms-inspected|payment-refunded)"
                    r"\.queue)$"
                ),
                "read": (
                    r"^(order\.topic\.exchange|oms\.topic\.exchange|oms\."
                    r"(order-payment-completed|return-requested|wms-inspected|payment-refunded)"
                    r"\.queue)$"
                ),
            },
        },
    )


    def read_secret(path, label):
        try:
            with open(path, "r", encoding="utf-8") as secret_file:
                value = secret_file.read()
        except OSError as error:
            raise RuntimeError(f"cannot read {label}") from error
        if not value or "\n" in value or "\r" in value:
            raise RuntimeError(f"{label} must be a non-empty single-line value")
        return value


    def api_request(method, resource, basic_token, tls_context, payload=None, timeout=10):
        body = None
        headers = {
            "Accept": "application/json",
            "Authorization": f"Basic {basic_token}",
        }
        if payload is not None:
            body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
            headers["Content-Type"] = "application/json"
        request = urllib.request.Request(
            f"{MANAGEMENT_URL}{resource}", data=body, headers=headers, method=method
        )
        try:
            with urllib.request.urlopen(
                request, context=tls_context, timeout=timeout
            ) as response:
                response_body = response.read()
                if not response_body:
                    return None
                return json.loads(response_body)
        except urllib.error.HTTPError as error:
            raise RuntimeError(
                f"{method} {resource} failed with HTTP status {error.code}"
            ) from None
        except (OSError, ValueError, urllib.error.URLError):
            raise RuntimeError(f"{method} {resource} failed") from None


    def load_identity(contract):
        username = read_secret(
            f"{contract['secret_path']}/username",
            f"{contract['name']} identity username",
        )
        password = read_secret(
            f"{contract['secret_path']}/password",
            f"{contract['name']} identity password",
        )
        if username != contract["username"]:
            raise RuntimeError(
                f"{contract['name']} identity username does not match the infrastructure contract"
            )
        return {**contract, "password": password}


    def reconcile_identity(identity, encoded_vhost, basic_token, tls_context):
        encoded_username = urllib.parse.quote(identity["username"], safe="")
        try:
            api_request(
                "PUT",
                f"/api/users/{encoded_username}",
                basic_token,
                tls_context,
                {"password": identity["password"], "tags": ""},
            )
            api_request(
                "PUT",
                f"/api/permissions/{encoded_vhost}/{encoded_username}",
                basic_token,
                tls_context,
                identity["permissions"],
            )
            expected_topic_permission = identity.get("topic_permission")
            if expected_topic_permission is not None:
                encoded_exchange = urllib.parse.quote(
                    expected_topic_permission["exchange"], safe=""
                )
                api_request(
                    "PUT",
                    f"/api/exchanges/{encoded_vhost}/{encoded_exchange}",
                    basic_token,
                    tls_context,
                    {
                        "type": "topic",
                        "durable": True,
                        "auto_delete": False,
                        "internal": False,
                        "arguments": {},
                    },
                )
                api_request(
                    "PUT",
                    f"/api/topic-permissions/{encoded_vhost}/{encoded_username}",
                    basic_token,
                    tls_context,
                    expected_topic_permission,
                )

            user = api_request(
                "GET", f"/api/users/{encoded_username}", basic_token, tls_context
            )
            permissions = api_request(
                "GET",
                f"/api/permissions/{encoded_vhost}/{encoded_username}",
                basic_token,
                tls_context,
            )
            if expected_topic_permission is not None:
                topic_permissions = api_request(
                    "GET",
                    f"/api/topic-permissions/{encoded_vhost}/{encoded_username}",
                    basic_token,
                    tls_context,
                )
            else:
                topic_permissions = None

            if not isinstance(user, dict) or user.get("name") != identity["username"]:
                raise RuntimeError("user verification failed")
            if user.get("tags") not in (None, "", []):
                raise RuntimeError("user unexpectedly has management tags")
            if not isinstance(permissions, dict) or any(
                permissions.get(key) != value
                for key, value in identity["permissions"].items()
            ):
                raise RuntimeError("permission verification failed")
            if expected_topic_permission is not None:
                if not isinstance(topic_permissions, list):
                    raise RuntimeError("topic permission verification failed")
                matching_topic_permissions = [
                    permission
                    for permission in topic_permissions
                    if permission.get("exchange")
                    == expected_topic_permission["exchange"]
                ]
                if len(matching_topic_permissions) != 1 or any(
                    matching_topic_permissions[0].get(key) != value
                    for key, value in expected_topic_permission.items()
                ):
                    raise RuntimeError("topic permission verification failed")
        except RuntimeError as error:
            raise RuntimeError(
                f"{identity['name']} identity reconciliation failed: {error}"
            ) from error

        print(
            f"Reconciled and verified {identity['name']} identity "
            f"{identity['username']} in {APPLICATION_VHOST} without management tags"
        )


    def main():
        bootstrap_username = read_secret(
            "/var/run/rabbitmq-secrets/bootstrap/username", "bootstrap username"
        )
        bootstrap_password = read_secret(
            "/var/run/rabbitmq-secrets/bootstrap/password", "bootstrap password"
        )
        identities = [load_identity(contract) for contract in IDENTITY_CONTRACTS]

        tls_context = ssl.create_default_context(
            cafile="/var/run/rabbitmq-secrets/ca/ca.crt"
        )
        basic_token = base64.b64encode(
            f"{bootstrap_username}:{bootstrap_password}".encode("utf-8")
        ).decode("ascii")

        deadline = time.monotonic() + READINESS_TIMEOUT_SECONDS
        while True:
            try:
                api_request(
                    "GET", "/api/overview", basic_token, tls_context, timeout=5
                )
                print("RabbitMQ HTTPS Management API is ready")
                break
            except RuntimeError:
                if time.monotonic() >= deadline:
                    raise RuntimeError(
                        "GET /api/overview did not become ready before timeout"
                    ) from None
                time.sleep(RETRY_SECONDS)

        encoded_vhost = urllib.parse.quote(APPLICATION_VHOST, safe="")

        api_request("PUT", f"/api/vhosts/{encoded_vhost}", basic_token, tls_context, {})
        vhost = api_request(
            "GET", f"/api/vhosts/{encoded_vhost}", basic_token, tls_context
        )
        if not isinstance(vhost, dict) or vhost.get("name") != APPLICATION_VHOST:
            raise RuntimeError("vhost verification failed")
        print(f"Reconciled and verified vhost {APPLICATION_VHOST}")

        for identity in identities:
            reconcile_identity(identity, encoded_vhost, basic_token, tls_context)

        print("RabbitMQ application identity provisioning verified for all identities")


    if __name__ == "__main__":
        try:
            main()
        except RuntimeError as error:
            print(f"RabbitMQ provisioning failed: {error}", file=sys.stderr)
            sys.exit(1)
        except Exception:
            print("RabbitMQ provisioning failed unexpectedly", file=sys.stderr)
            sys.exit(1)
