apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-application-provisioning
  # RabbitMQ Cluster, CA trust, application credential 준비 후 실행하는 provisioning Job입니다.
  # Argo CD Hook 등 실제 실행 및 배포 방식은 GitOps 구성에서 결정합니다.
  labels:
    app.kubernetes.io/name: rabbitmq-provisioner
    app.kubernetes.io/component: credential-provisioning
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 660
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq-provisioner
        app.kubernetes.io/component: credential-provisioning
    spec:
      serviceAccountName: rabbitmq-provisioner
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provisioner
          image: python:3.13.7-alpine3.22
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -B
            - /opt/rabbitmq-provisioning/provision.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: provisioning-script
              mountPath: /opt/rabbitmq-provisioning
              readOnly: true
            - name: bootstrap-credentials
              mountPath: /var/run/rabbitmq-secrets/bootstrap
              readOnly: true
            - name: application-credentials
              mountPath: /var/run/rabbitmq-secrets/application
              readOnly: true
            - name: ca-trust
              mountPath: /var/run/rabbitmq-secrets/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: provisioning-script
          configMap:
            name: rabbitmq-provisioning-script
            defaultMode: 0555
        - name: bootstrap-credentials
          secret:
            secretName: rabbitmq-default-user
            defaultMode: 0440
            items:
              - key: username
                path: username
              - key: password
                path: password
        - name: application-credentials
          secret:
            secretName: rabbitmq-app-credentials
            defaultMode: 0440
            items:
              - key: username
                path: username
              - key: password
                path: password
        - name: ca-trust
          secret:
            secretName: rabbitmq-ca
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
