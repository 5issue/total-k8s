- op: add
  path: /spec/persistence
  value:
    storageClassName: gp3
    storage: 5Gi
- op: add
  path: /spec/resources
  value:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1.5Gi
- op: add
  path: /spec/affinity
  value:
    # TEMP: deployment ordering 적용 전 RabbitMQ Pending 방지를 위해 OD 강제 일시 해제
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #           - key: eks.amazonaws.com/capacityType
    #             operator: In
    #             values:
    #               - ON_DEMAND
    #       - matchExpressions:
    #           - key: karpenter.sh/capacity-type
    #             operator: In
    #             values:
    #               - on-demand
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: rabbitmq
            topologyKey: kubernetes.io/hostname
        - weight: 80
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: rabbitmq
            topologyKey: topology.kubernetes.io/zone
- op: add
  path: /spec/tls
  value:
    secretName: rabbitmq-server-tls
    disableNonTLSListeners: true
- op: add
  path: /spec/terminationGracePeriodSeconds
  value: 120
- op: add
  path: /spec/override
  value:
    statefulSet:
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              runAsGroup: 999
              fsGroup: 999
              fsGroupChangePolicy: OnRootMismatch
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: rabbitmq
                # ==========================================
                # [수정] 401 인증 우회: CLI 기반 startupProbe
                # ==========================================
                startupProbe:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - rabbitmq-diagnostics -q ping
                  failureThreshold: 60
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 10
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault