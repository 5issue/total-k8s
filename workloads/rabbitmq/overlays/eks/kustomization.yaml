apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: messaging

resources:
  - ../../base
  - namespace.yaml
  - rabbitmq-tls.yaml
  - network-policy.yaml
  - pdb.yaml
  - provisioning-service-account.yaml
  - provisioning-script.yaml
  - provisioning-job.yaml

patches:
  - path: rabbitmq-cluster-patch.yaml
    target:
      group: rabbitmq.com
      version: v1beta1
      kind: RabbitmqCluster
      name: rabbitmq
