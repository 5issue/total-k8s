# 블루그린 배포 데모
# 배포 전략 검증이 목적이라 기동이 빠른 경량 이미지(nginx)를 사용한다.
# 시연: kubectl argo rollouts set image auth-bluegreen-demo demo=public.ecr.aws/nginx/nginx:1.27 -n backend

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-bluegreen-demo
  namespace: backend
spec:
  replicas: 2
  strategy:
    blueGreen:
      activeService: auth-bg-active    # 파랑: 사용자 트래픽이 가는 곳
      previewService: auth-bg-preview  # 초록: 새 버전 미리보기
      autoPromotionEnabled: false      # 사람이 promote 해야 전환됨
  selector:
    matchLabels:
      app: auth-bluegreen-demo
  template:
    metadata:
      labels:
        app: auth-bluegreen-demo
    spec:
      containers:
        - name: demo
          image: public.ecr.aws/nginx/nginx:1.26   # v1 (시작 버전)
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 64Mi }
---
# 파랑 Service (현재 운영 - 사용자 트래픽)
apiVersion: v1
kind: Service
metadata:
  name: auth-bg-active
  namespace: backend
spec:
  selector:
    app: auth-bluegreen-demo           # Argo Rollouts가 버전 구분 라벨을 자동으로 추가함
  ports:
    - port: 80
      targetPort: 80
---
# 초록 Service (새 버전 미리보기)
apiVersion: v1
kind: Service
metadata:
  name: auth-bg-preview
  namespace: backend
spec:
  selector:
    app: auth-bluegreen-demo
  ports:
    - port: 80
      targetPort: 80
