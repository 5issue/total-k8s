# 블루그린 배포 예제


apiVersion: argoproj.io/v1alpha1
kind: Rollout                          # Deployment 대신 Rollout
metadata:
  name: auth-bluegreen-demo
  namespace: backend
spec:
  replicas: 2
  strategy:
    blueGreen:                         # 블루그린 방식
      activeService: auth-bg-active    # 현재 운영(파랑) - 사용자가 여기 접속
      previewService: auth-bg-preview  # 새 버전 미리보기(초록) - 테스트용
      autoPromotionEnabled: false      # 수동 승인 후 전환 (자동 아님)
  selector:
    matchLabels:
      app: auth-bluegreen-demo
  template:
    metadata:
      labels:
        app: auth-bluegreen-demo
    spec:
      containers:
        - name: auth
          image: "596601390909.dkr.ecr.ap-northeast-2.amazonaws.com/kurly-auth:latest"
          ports:
            - containerPort: 8080
---
# 파랑 Service (현재 운영 - 사용자 트래픽)
apiVersion: v1
kind: Service
metadata:
  name: auth-bg-active
  namespace: backend
spec:
  selector:
    app: auth-bluegreen-demo
  ports:
    - port: 8080
      targetPort: 8080
---
# 초록 Service (새 버전 미리보기 - 테스트용)
apiVersion: v1
kind: Service
metadata:
  name: auth-bg-preview
  namespace: backend
spec:
  selector:
    app: auth-bluegreen-demo
  ports:
    - port: 8080
      targetPort: 8080
