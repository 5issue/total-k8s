apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-provisioning-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/5issue/total-k8s.git'
    targetRevision: HEAD
    path: 'workloads/rabbitmq/provisioning/overlays/eks'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: messaging
