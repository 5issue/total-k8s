apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/5issue/total-k8s.git'
    targetRevision: main
    path: k8s/backend-ingress
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: backend
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
