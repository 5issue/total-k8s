apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moco-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/5issue/total-k8s.git'
    targetRevision: HEAD
    path: 'k8s/moco'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: moco-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true