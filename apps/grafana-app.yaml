apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/5issue/total-k8s.git'
    targetRevision: HEAD
    path: 'k8s/grafana'
    directory:
      recurse: true
      exclude: '{*.example,memo.md}'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring # grafana 매니페스트에 지정된 namespace에 맞게 적용됨
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true