apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-shared-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/5issue/total-k8s.git'
    targetRevision: HEAD
    path: 'k8s/workloads/postgres-shared/overlays/eks'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true