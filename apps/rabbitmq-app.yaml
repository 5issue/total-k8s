apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/5issue/total-k8s.git'
    targetRevision: HEAD
    path: 'workloads/rabbitmq/overlays/eks'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: messaging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Fresh EKS 초기 prerequisite 지연으로 인한 sync 실패만 제한적으로 재시도합니다.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
