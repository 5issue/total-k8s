apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/5issue/total-k8s.git'
    targetRevision: HEAD
    path: 'k8s/argocd'
    directory:
      recurse: true
      exclude: '{*.example,memo.md}'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true