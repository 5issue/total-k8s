apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-rbac
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/5issue/total-k8s.git
    targetRevision: HEAD
    path: workloads/developer-rbac/overlays/eks
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true