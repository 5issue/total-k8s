# 서비스 식별 (서비스별로 나중에 덮어씀)
serviceName: PLACEHOLDER      # 예: auth-service (values/auth.yaml에서 채움)
replicaCount: 1               # 파드 개수 (기본 1개)

# 컨테이너 이미지 (ECR 창고 주소)
image:
  registry: "596601390909.dkr.ecr.ap-northeast-2.amazonaws.com"  # 우리 ECR 주소
  repository: PLACEHOLDER      # 예: kurly-auth (서비스별로 채움)
  tag: "latest"               # 이미지 태그
  pullPolicy: Always          # 항상 최신 이미지 받기


# 서비스(고정 진입점) 설정
service:
  type: ClusterIP             # 클러스터 내부 전용

# 리소스 (CPU·메모리 최소/최대)
resources:
  requests:                   # 최소 보장
    cpu: "100m"               # 0.1 CPU
    memory: "256Mi"
  limits:                     # 최대 상한
    cpu: "500m"               # 0.5 CPU
    memory: "512Mi"

# RabbitMQ (메시징) — ★ 5671 + SSL 확정 반영
rabbitmq:
  host: "rabbitmq.messaging.svc.cluster.local"  # 클러스터 내부 주소
  port: 5671                  # ★ TLS 전용 포트 (5672 아님)
  sslEnabled: true            # ★ SSL 켜기
  caSecretName: rabbitmq-ca
  caSecretKey: ca.crt
  caMountPath: /etc/ssl/certs/rabbitmq
  sslCertPath: /etc/ssl/certs/rabbitmq/ca.crt


  # 헬스체크 (건강검진) 설정
health:
  path: /actuator/health   # Spring Boot 기본 건강검진 주소
  livenessDelay: 30        # 컨테이너 뜨고 30초 뒤부터 생존검사 시작 (앱 뜰 시간 줌)
  readinessDelay: 10       # 10초 뒤부터 준비검사 시작

# PDB (파드 중단 예산) 설정
pdb:
  maxUnavailable: 1     # 최대 1개까지만 동시에 내려라


# NetworkPolicy (네트워크 방화벽) 설정
networkPolicy:
  enabled: true
  allowFromNamespaces:      # 이 네임스페이스에서 오는 트래픽만 허용
    - ingress-nginx         # 외부 진입 통로
    - backend               # 백엔드 서비스끼리

# 모든 서비스 공통 포트 (쿠버네티스는 파드 격리라 통일 가능)
serverPort: 8080
