# 최소 몇개 pod 유지 규칙
# templates/pdb.yaml
{{- if and .Values.pdb (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.serviceName }}-pdb      # 예: oms-service-pdb
  namespace: {{ .Release.Namespace }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}   # minAvailable에서 변경
  selector:
    matchLabels:
      app: {{ .Values.serviceName }}       # 이 라벨 붙은 파드를 대상으로
{{- end }}