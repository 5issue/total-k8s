{{- if ne .Values.serviceName "swagger-ui" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceName }}          # values의 serviceName이 채워짐 (예: auth-service)
spec:
  replicas: {{ .Values.replicaCount }}      # 파드 개수 (values에서)
  selector:
    matchLabels:
      app: {{ .Values.serviceName }}        # 이 라벨 붙은 파드를 내가 관리한다
  template:                                 # ↓ 여기서부터 파드 하나의 설계
    metadata:
      labels:
        app: {{ .Values.serviceName }}      # 파드에 붙일 라벨 (위 selector와 일치해야 함)
    spec:
      # 노드별 1대씩 분산 배치
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.serviceName }}
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.serviceName }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: {{ .Values.serviceName }}
          # 이미지 주소 = 레지스트리/이미지이름:태그 (세 값 조합)
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.serverPort }}   # 컨테이너 포트 (8080 공통)
          env:                              # ↓ 컨테이너에 넣을 환경변수
            - name: SERVER_PORT
              value: "{{ .Values.serverPort }}"
            # RabbitMQ (values.yaml의 5671 + SSL이 여기로 들어감)
            - name: SPRING_RABBITMQ_HOST
              value: "{{ .Values.rabbitmq.host }}"
            - name: SPRING_RABBITMQ_PORT
              value: "{{ .Values.rabbitmq.port }}"          # 5671
            - name: SPRING_RABBITMQ_SSL_ENABLED
              value: "{{ .Values.rabbitmq.sslEnabled }}"    # true
            - name: RABBITMQ_SSL_CERT_PATH
              value: "{{ .Values.rabbitmq.sslCertPath }}"
            # DB 접속 정보 (values의 database 블록에서 가져옴)
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.springProfile | default "local" }}"
            - name: DB_HOST
              value: "{{ .Values.database.host }}"        # DB 주소
            - name: DB_PORT
              value: "{{ .Values.database.port }}"        # DB 포트
            - name: DB_NAME
              value: "{{ .Values.database.name }}"        # DB 이름
            - name: DB_USERNAME
              value: "{{ .Values.database.username }}"   # 직접 값              
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.passwordKey }}   # values에서 password key
            # Redis 접속 (values의 redis 블록에서)
            - name: REDIS_HOST
              value: "{{ .Values.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.redis.port }}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: {{ .Values.redis.passwordKey }}
            # RABBITMQ 접속
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.credentialsSecretName }}
                  key: {{ .Values.rabbitmq.usernameKey }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.credentialsSecretName }}
                  key: {{ .Values.rabbitmq.passwordKey }}
            - name: RABBITMQ_VHOST
              value: {{ .Values.rabbitmq.vhost | quote }}
            {{- with .Values.rabbitmq.springConnectionOverrides }}
            {{- if .enabled }}
            # WMS local profile에 없는 vhost 및 PEM SSL bundle 설정을 직접 재정의한다.
            - name: SPRING_RABBITMQ_VIRTUALHOST
              value: {{ $.Values.rabbitmq.vhost | quote }}
            - name: SPRING_SSL_BUNDLE_PEM_RABBITMQ_TRUSTSTORE_CERTIFICATE
              value: {{ $.Values.rabbitmq.sslCertPath | quote }}
            - name: SPRING_RABBITMQ_SSL_BUNDLE
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_SSL_VERIFYHOSTNAME
              value: "true"
            {{- end }}
            {{- end }}
          
          
           # 생존 검사 — 실패하면 컨테이너 재시작
          livenessProbe:
            tcpSocket:
              port: {{ .Values.serverPort }}
            initialDelaySeconds: {{ .Values.health.livenessDelay }}
          # 준비 검사 — 실패하면 트래픽 제외 (재시작은 안 함)
          readinessProbe:
            tcpSocket:
              port: {{ .Values.serverPort }}
            initialDelaySeconds: {{ .Values.health.readinessDelay }}
          resources:                        # CPU·메모리 (values의 resources 통째로)
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: rabbitmq-ca
              mountPath: {{ .Values.rabbitmq.caMountPath }}
              readOnly: true
      volumes:
        - name: rabbitmq-ca
          secret:
            secretName: {{ .Values.rabbitmq.caSecretName }}
            items:
              - key: {{ .Values.rabbitmq.caSecretKey }}
                path: ca.crt
{{- end -}}
