apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceName }}          # 파드와 같은 이름의 진입점 (예: auth-service)
  namespace: backend
spec:
  type: {{ .Values.service.type }}         # ClusterIP = 클러스터 내부 전용
  selector:
    app: {{ .Values.serviceName }}         # 이 라벨 붙은 파드로 트래픽을 보냄
  ports:
    - port: {{ .Values.service.port }}     # Service가 받는 포트
      targetPort: {{ .Values.containerPort }}  # 실제 컨테이너 포트로 넘김 (예: 8081)
      protocol: TCP