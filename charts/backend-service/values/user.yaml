image:
  repository: kurly-user              # ECR 창고 이름
containerPort: 8088            # user 포트
service:
  port: 8088                   # Service 포트도 동일하게

database:
  type: mysql
  host: shared-mysql-primary.backend.svc.cluster.local   # TODO[1] 재혁님 확인 (실제 svc명)
  port: 3306
  name: user_db                                          # TODO[2] 확인
  secretName: TODO-mysql-secret                          # TODO[3] MySQL Secret 이름 미정