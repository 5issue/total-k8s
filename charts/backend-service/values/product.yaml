# product-service 전용 값 (공통은 values.yaml에서 물려받음)
serviceName: product-service        # 이 서비스 이름
replicaCount: 2
image:
  repository: kurly-product              # ECR 창고 이름
containerPort: 8084            # product 포트
service:
  port: 8084                   # Service 포트도 동일하게


database:
  type: postgresql
  host: shared-pg-rw.backend.svc.cluster.local           # TODO[1] 재혁님 확인
  port: 5432
  name: product_db                                       # ← 서비스마다 변경
  secretName: shared-pg-app                              # CNPG 자동생성 (추정)