# product-service 전용 값 (공통은 values.yaml에서 물려받음)
serviceName: product-service        # 이 서비스 이름
replicaCount: 2
image:
  repository: kurly-product              # ECR 창고 이름
  tag: "c6fda5f928b3fe639370189e4e0fe1f55e0de870"


database:
  type: postgresql
  host: shared-pg-rw.backend.svc.cluster.local           # TODO[1]
  port: 5432
  name: product_db                                       # ← 서비스마다 변경
  secretName: shared-pg-product-service-credentials   # 서비스별 Secret
  username: product_user                                # PostgreSQL은 username key 있음
  passwordKey: password

keda:
  queues:
    - product.inventory.confirm.queue
    - product.inventory.release.queue
    - product.inventory.restore.queue
    - product.inbound.completed.queue
    - product.outbound.completed.queue

serviceAccount:
  create: true
  name: product-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::596601390909:role/product-service-irsa
javaToolOptions: >-
  -XX:InitialRAMPercentage=25.0
  -XX:MaxRAMPercentage=50.0

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"