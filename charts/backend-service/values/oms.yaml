# oms-service 전용 값 (공통은 values.yaml에서 물려받음)
serviceName: oms-service
image:
  repository: kurly-oms
  tag: "75efac7f2b1959c8d8459c066d4df3624a35c829"

rabbitmq:
  credentialsSecretName: rabbitmq-oms-credentials

database:
  type: postgresql
  host: shared-pg-rw.backend.svc.cluster.local
  port: 5432
  name: oms_db
  secretName: shared-pg-oms-service-credentials
  username: oms_user
  passwordKey: password
  springDatasourceOverride:   # DB 덮어쓰기 스위치
    enabled: true             # oms만 켬

keda:
  queues:
    - oms.order-payment-completed.queue
    - oms.return-requested.queue
    - oms.wms-inspected.queue
    - oms.payment-refunded.queue

serviceAccount:
  create: true
  name: oms-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::596601390909:role/oms-service-irsa
