serviceName: kurly-ai-serving
replicaCount: 1

image:
  registry: 596601390909.dkr.ecr.ap-northeast-2.amazonaws.com
  repository: kurly-ai-assistant
  tag: "b537356e7f44543d411144283ab45cb0d1ba4709"
  pullPolicy: Always

serverPort: 8000

# CNPG 연결 설정
database:
  host: shared-pg-rw.backend.svc.cluster.local
  port: 5432
  name: ai_db
  username: ai_user
  secretName: shared-pg-ai-service-credentials
  passwordKey: password

health:
  livenessDelay: 20
  readinessDelay: 15
# 테스트용 권장 리소스 설정
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

networkPolicy:
  enabled: true
  allowFromNamespaces:
    - backend   # 백엔드 마이크로서비스에서 AI 호출 허용
    - dev       # dev 네임스페이스 내부 파드 통신 허용
    - frontend  # api 호출 허용
  # allowFromCidrs는 아예 적지 않거나 비워둠 (ALB/외부 Ingress 원천 차단)
  allowFromCidrs:
    - "10.0.0.0/16"   # ALB가 위치한 VPC 서브넷 대역

serviceAccount:
  create: true
  name: ai-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::596601390909:role/ai-service-irsa

# LLM 연동 설정 (AI팀 가이드 기준)
environment: prod
llm:
  reasonModel: "google/gemini-3.5-flash-lite"   # OpenRouter 모델명 (AI팀 가이드 3-3)
  apiKeySecret: ai-llm-secret                   # OPENROUTER_API_KEY를 꺼낼 Secret

# Bearer(JWT) 검증 설정 — BFF의 Bearer 전파 배포와 같은 시점에 적용
# jwksUrl 이 스위치입니다. 비어 있으면 X-User-Id 헤더 방식, 값이 있으면 Bearer JWT 만 받고 X-User-Id 는 무시합니다.
# 2026-10-02 BFF 가 Authorization: Bearer 전파를 시작해 전환했습니다. 되돌리려면 jwksUrl 을 "" 로.
jwt:
  issuer: "https://api.cloudyim.store"          # auth-service JWT_ISSUER와 동일 (끝 슬래시 없음)
  audience: "cloudyim-client"
  algorithms: "ES256"
  jwksUrl: "http://auth-service:8080/.well-known/jwks.json"   # 같은 backend 네임스페이스의 auth-service

# 배치: AI는 Karpenter Spot 노드에만 (On-Demand는 DB·Redis 등 상태 저장 전용)
nodeSelector:
  karpenter.sh/capacity-type: spot
