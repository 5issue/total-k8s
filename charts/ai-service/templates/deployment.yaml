apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceName }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.serviceName }}
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.serviceName }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: {{ .Values.serviceName }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.serverPort }}
          env:
            - name: SERVER_PORT
              value: "{{ .Values.serverPort }}"
            - name: DB_HOST
              value: "{{ .Values.database.host }}"
            - name: DB_PORT
              value: "{{ .Values.database.port }}"
            - name: DB_NAME
              value: "{{ .Values.database.name }}"
            - name: DB_USER
              value: "{{ .Values.database.username }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.passwordKey }}
            - name: ENVIRONMENT
              value: "local"
            - name: HOST
              value: "0.0.0.0"
            - name: LLM_PROVIDER
              value: "{{ .Values.llm.provider }}"
            - name: LLM_BASE_URL
              value: "{{ .Values.llm.baseUrl }}"
            - name: LLM_MODEL
              value: "{{ .Values.llm.model }}"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.apiKeySecret }}
                  key: LLM_API_KEY 
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.username }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
          livenessProbe:
            tcpSocket:
              port: {{ .Values.serverPort }}
            initialDelaySeconds: {{ .Values.health.livenessDelay }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.serverPort }}
            initialDelaySeconds: {{ .Values.health.readinessDelay }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
