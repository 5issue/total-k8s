apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceName }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.serviceName }}
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.serviceName }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: {{ .Values.serviceName }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.serverPort }}
          env:
            - name: SERVER_PORT
              value: "{{ .Values.serverPort }}"
            - name: DB_HOST
              value: "{{ .Values.database.host }}"
            - name: DB_PORT
              value: "{{ .Values.database.port }}"
            - name: DB_NAME
              value: "{{ .Values.database.name }}"
            - name: DB_USER
              value: "{{ .Values.database.username }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.passwordKey }}
            - name: ENVIRONMENT
              value: "{{ .Values.environment }}"
            # 추천 이유 LLM (AI팀 가이드 3-3): serving은 이 두 변수만 읽음
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.apiKeySecret }}
                  key: LLM_API_KEY          # Secret 안의 키 이름은 그대로 사용 (Terraform 변경 불필요)
            - name: REASON_MODEL
              value: "{{ .Values.llm.reasonModel }}"
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.username }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=disable"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.serverPort }}
            initialDelaySeconds: {{ .Values.health.livenessDelay }}
          readinessProbe:
            httpGet:
              path: /health/db
              port: {{ .Values.serverPort }}
            initialDelaySeconds: {{ .Values.health.readinessDelay }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
